name: Rebuild Lefty browser atlas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-lefty-webp.yml'
      - 'AnimationTests/Lefty/lefty-atlas-v67.avif'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image tooling
        run: npm install --prefix StereoTypeFighter
      - name: Convert validated AVIF to browser-safe WebP
        working-directory: StereoTypeFighter
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { stat } from 'node:fs/promises';
          const src='../AnimationTests/Lefty/lefty-atlas-v67.avif';
          const out='../AnimationTests/Lefty/lefty-atlas-v67.webp';
          await sharp(src).webp({quality:82,alphaQuality:100,smartSubsample:true}).toFile(out);
          const meta=await sharp(out).metadata();
          if(meta.width!==896||meta.height!==1120||meta.format!=='webp') throw new Error(`Unexpected WebP metadata ${meta.width}x${meta.height} ${meta.format}`);
          const {data,info}=await sharp(out).ensureAlpha().raw().toBuffer({resolveWithObject:true});
          let visible=0;
          for(let i=0;i<data.length;i+=info.channels){const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];if(a>24&&(r+g+b)>36)visible++;}
          if(visible<100000) throw new Error(`Atlas has insufficient visible pixels: ${visible}`);
          console.log({width:meta.width,height:meta.height,format:meta.format,visible,size:(await stat(out)).size});
          NODE
      - name: Commit browser-safe atlas to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AnimationTests/Lefty/lefty-atlas-v67.webp
          if git diff --cached --quiet; then
            echo 'WebP already current.'
          else
            git commit -m 'Rebuild Lefty browser-safe WebP atlas'
            git push origin HEAD:main
          fi
