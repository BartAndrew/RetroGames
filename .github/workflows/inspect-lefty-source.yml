name: Inspect Lefty source candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-lefty-source.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix StereoTypeFighter
      - name: Inspect candidate images
        working-directory: StereoTypeFighter
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import sharp from 'sharp';
          const entries=await fs.readdir('.',{withFileTypes:true});
          const files=entries.filter(e=>e.isFile()).map(e=>e.name).filter(n=>/\.(png|webp|jpg|jpeg)$/i.test(n)||n==='9724e2fc-6fed-4d11-abbd-14ae6a55d820');
          for(const file of files){
            try{
              const img=sharp(file),meta=await img.metadata();
              if(file==='9724e2fc-6fed-4d11-abbd-14ae6a55d820') console.log(JSON.stringify({uuid:file,width:meta.width,height:meta.height,format:meta.format}));
              if(meta.width!==1536||meta.height!==1024) continue;
              const {data}=await img.resize(4,4,{fit:'fill'}).removeAlpha().raw().toBuffer({resolveWithObject:true});
              console.log(JSON.stringify({file,sig:Buffer.from(data).toString('hex')}));
            }catch(e){console.log(JSON.stringify({file,error:e.message}))}
          }
          NODE
