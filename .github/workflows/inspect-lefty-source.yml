name: Inspect Lefty source candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-lefty-source.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix StereoTypeFighter
      - name: Match candidate images to supplied Lefty reference
        working-directory: StereoTypeFighter
        run: |
          mkdir -p ../artifacts/lefty-source
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import sharp from 'sharp';
          const target=Buffer.from('2d4c5529445c5b697f2c41562f4a59304754304754294555304e5f2e4c5f2f4958273e4a2d3d45223949263944213944','hex');
          const entries=await fs.readdir('.',{withFileTypes:true});
          const files=entries.filter(e=>e.isFile()).map(e=>e.name).filter(n=>/\.(png|webp|jpg|jpeg)$/i.test(n)||n==='9724e2fc-6fed-4d11-abbd-14ae6a55d820');
          const matches=[];
          for(const file of files){
            try{
              const img=sharp(file,{failOn:'none'}),meta=await img.metadata();
              if(meta.width!==1536||meta.height!==1024) continue;
              const {data}=await img.resize(4,4,{fit:'fill'}).removeAlpha().raw().toBuffer({resolveWithObject:true});
              let distance=0;for(let i=0;i<Math.min(data.length,target.length);i++)distance+=Math.abs(data[i]-target[i]);
              matches.push({file,distance,sig:Buffer.from(data).toString('hex'),format:meta.format});
            }catch(e){console.log(JSON.stringify({file,error:e.message}))}
          }
          matches.sort((a,b)=>a.distance-b.distance);
          console.log('LEFTY_MATCHES='+JSON.stringify(matches.slice(0,12)));
          if(matches[0]){
            console.log('BEST_LEFTY_MATCH='+JSON.stringify(matches[0]));
            await fs.copyFile(matches[0].file,'../artifacts/lefty-source/best-lefty-source.png');
          }
          NODE
      - name: Upload best source candidate
        uses: actions/upload-artifact@v4
        with:
          name: best-lefty-source
          path: artifacts/lefty-source/best-lefty-source.png
          if-no-files-found: error
