name: Lefty standalone animation test

on:
  push:
    branches: [main]
    paths:
      - 'AnimationTests/Lefty/**'
      - 'StereoTypeFighter/assets/characters/v66/lefty-atlas-v65.webp'
      - '.github/workflows/lefty-animation-test.yml'
  workflow_dispatch:

jobs:
  lefty-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4174 --directory . > /tmp/lefty-test-server.log 2>&1 &
          echo $! > /tmp/lefty-test-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4174/AnimationTests/Lefty/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/lefty-test-server.log
          exit 1

      - name: Verify visible V6.9 recovery atlas in Chromium
        run: |
          mkdir -p artifacts/lefty-animation
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1280,height:900}, deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', msg => { if (msg.type()==='error') errors.push(msg.text()); });
            await page.goto('http://127.0.0.1:4174/AnimationTests/Lefty/', {waitUntil:'networkidle'});
            await page.waitForFunction(() => window.leftyTest && window.leftyTest.ready === true, null, {timeout:10000});
            const state = await page.evaluate(() => window.leftyTest);
            if (!state.ready) throw new Error('Lefty V6.9 recovery test did not reach ready state');
            if (!state.visible) throw new Error('Lefty sprite pixels are not visible');
            if (state.pixels < 500) throw new Error(`Insufficient visible sprite pixels: ${state.pixels}`);
            if (state.frames !== 48) throw new Error(`Expected 48 validated production frames, got ${state.frames}`);
            if (!state.geometry) throw new Error(`Invalid atlas geometry: ${state.atlas.join('x')}`);
            if (state.cell[0] !== 160 || state.cell[1] !== 112) throw new Error(`Unexpected cell ${state.cell.join('x')}`);
            await page.screenshot({path:'artifacts/lefty-animation/idle.png', fullPage:true});
            await page.selectOption('#movement', {label:'kick (4)'});
            await page.waitForTimeout(750);
            await page.screenshot({path:'artifacts/lefty-animation/kick.png', fullPage:true});
            await page.selectOption('#movement', {label:'special (4)'});
            await page.waitForTimeout(900);
            await page.screenshot({path:'artifacts/lefty-animation/special.png', fullPage:true});
            const status = await page.locator('#selfTest').textContent();
            if (!status.startsWith('PASS')) throw new Error(`Self-test status: ${status}`);
            if (errors.length) throw new Error(`Browser errors: ${errors.join(' | ')}`);
            fs.writeFileSync('artifacts/lefty-animation/result.json', JSON.stringify(state,null,2));
            console.log(JSON.stringify(state,null,2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload animation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lefty-animation-test
          path: artifacts/lefty-animation
          if-no-files-found: warn
