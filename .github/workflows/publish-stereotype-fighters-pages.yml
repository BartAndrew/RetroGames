name: Publish RetroGames arcade to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test site builder
        run: python3 -m unittest discover -s tools -p 'test_build_site.py' -v

      - name: Validate links and stage the complete arcade
        run: python3 tools/build_site.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Stereotype Fighter QA dependencies
        working-directory: StereoTypeFighter
        run: npm install --no-audit --no-fund

      - name: Run layout and deterministic engine tests
        working-directory: StereoTypeFighter
        run: |
          npm run test:layout
          npm run test:unit

      - name: Build compact production fighter atlases
        working-directory: StereoTypeFighter
        run: node tools/build-v66-assets.mjs --site ../_site/StereoTypeFighter

      - name: Prune source-only game files
        working-directory: StereoTypeFighter
        run: node tools/prune-v66-site.mjs --site ../_site/StereoTypeFighter

      - name: Verify staged production assets
        working-directory: StereoTypeFighter
        run: node tools/verify-v66-assets.mjs --site ../_site/StereoTypeFighter

      - name: Install Chromium
        working-directory: StereoTypeFighter
        run: npx playwright install --with-deps chromium

      - name: Run production browser and mobile regression suite
        working-directory: StereoTypeFighter
        run: npm run test:browser

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stereotype-fighter-browser-qa
          path: |
            StereoTypeFighter/playwright-report
            StereoTypeFighter/test-results
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete arcade site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
