name: Inspect Lefty V6.8 atlas candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-lefty-v68.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix StereoTypeFighter
      - name: Decode and inspect Lefty candidates
        working-directory: StereoTypeFighter
        run: |
          mkdir -p ../artifacts/lefty-v68
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import sharp from 'sharp';
          const dir='assets/characters/v66';
          const files=await fs.readdir(dir);
          const groups=[
            ['lefty96-v68',files.filter(x=>/^lefty96-v68-\d+\.b64$/.test(x)).sort()],
            ['lefty-reference-v68',files.filter(x=>/^lefty-reference-v68-\d+\.b64$/.test(x)).sort()],
            ['lefty-v67',files.filter(x=>/^lefty-v67-\d+\.b64$/.test(x)).sort()]
          ];
          for(const [name,parts] of groups){
            if(!parts.length){console.log(JSON.stringify({name,error:'no chunks'}));continue;}
            try{
              const text=(await Promise.all(parts.map(p=>fs.readFile(path.join(dir,p),'utf8')))).join('').replace(/\s/g,'');
              const buf=Buffer.from(text,'base64');
              const img=sharp(buf,{failOn:'none'});
              const meta=await img.metadata();
              const {data,info}=await img.ensureAlpha().raw().toBuffer({resolveWithObject:true});
              let alpha=0,bright=0;
              for(let i=0;i<data.length;i+=info.channels){const a=data[i+3];if(a>24)alpha++;if(a>24&&(data[i]+data[i+1]+data[i+2])>36)bright++;}
              if(meta.format==='png') await fs.writeFile(`../artifacts/lefty-v68/${name}.png`,buf);
              console.log(JSON.stringify({name,parts,bytes:buf.length,width:meta.width,height:meta.height,format:meta.format,channels:meta.channels,alphaPixels:alpha,visiblePixels:bright}));
            }catch(e){console.log(JSON.stringify({name,parts,error:e.message}))}
          }
          NODE
      - name: Upload decoded candidates
        uses: actions/upload-artifact@v4
        with:
          name: lefty-v68-candidates
          path: artifacts/lefty-v68
          if-no-files-found: warn
